# cchat 전용 tmux 서버(-L @@TMUX_SOCKET@@) 설정. 다른 tmux 세션에는 영향 없음.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g window-size latest
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g set-clipboard on
# 상태줄: 한 줄 전체가 대화 탭
set -g status-interval 5
set -g status-style "bg=colour67,fg=colour66"
set -g status-left-length 1000
# 맨 아래 줄 전체 = 대화 탭(bin/cchat-tabs). 지금 대화 검정, 답 끝남 녹색, 허락 대기 주황, 작업 중 번호 옆 스피너, 나머지 회색.
# 대화 목록·안읽음·◀▶ 범위(@cchat_tabgen)가 바뀌면 명령 문자열이 바뀌어 바로 다시 그린다.
# 기본(tab rows 1): 탭 높이 2줄 = 위 줄 번호(l0), 아래 줄 이름표(l1). cchat-set tab rows 2~5면 한 줄짜리 탭을 그 줄 수에 나눠 그린다.
# 줄 수는 cchat-tabs apply가 설정을 읽어 status 값으로 맞춘다. 폰 탭 처리(cchat-build-index STATUS_ROWS)도 같은 줄 수.
set -g status 2
set -g status-format[0] "#(@@HOME@@/.local/bin/cchat-tabs render '#{client_name}' '#{client_width}' '#{client_session}' '#{S/n:#{session_name}#{?#{@unread},+#{@unread},#{?#{@busy},+busy,}} }' '#{@cchat_tabgen}' l0)"
set -g status-format[1] "#(@@HOME@@/.local/bin/cchat-tabs render '#{client_name}' '#{client_width}' '#{client_session}' '#{S/n:#{session_name}#{?#{@unread},+#{@unread},#{?#{@busy},+busy,}} }' '#{@cchat_tabgen}' l1)"
set -g status-format[2] "#(@@HOME@@/.local/bin/cchat-tabs render '#{client_name}' '#{client_width}' '#{client_session}' '#{S/n:#{session_name}#{?#{@unread},+#{@unread},#{?#{@busy},+busy,}} }' '#{@cchat_tabgen}' l2)"
set -g status-format[3] "#(@@HOME@@/.local/bin/cchat-tabs render '#{client_name}' '#{client_width}' '#{client_session}' '#{S/n:#{session_name}#{?#{@unread},+#{@unread},#{?#{@busy},+busy,}} }' '#{@cchat_tabgen}' l3)"
set -g status-format[4] "#(@@HOME@@/.local/bin/cchat-tabs render '#{client_name}' '#{client_width}' '#{client_session}' '#{S/n:#{session_name}#{?#{@unread},+#{@unread},#{?#{@busy},+busy,}} }' '#{@cchat_tabgen}' l4)"
run-shell -b "@@HOME@@/.local/bin/cchat-tabs apply"
set -g status-right-length 0
set -g status-right ""
# 상태줄 클릭: 탭이면 그 대화로 전환, ◀ ▶(_prev/_next)면 보이는 범위만 밀기, 나머지는 tmux 기본 동작
bind -n MouseDown1Status if -F "#{m/r:^(left|right|window|)$,#{mouse_status_range}}" "select-window -t =" "if -F '#{m/r:^_(prev|next|new)$,#{mouse_status_range}}' \"run-shell '@@HOME@@/.local/bin/cchat-tabs click #{client_name} #{mouse_status_range}'\" \"run-shell -C \\\"switch-client -t '=#{mouse_status_range}'\\\"\""
set -g window-status-format ""
set -g window-status-current-format ""
set -g focus-events on
# 대화를 보면(전환·접속·브라우저 탭 포커스) 색 표시를 지운다. 표시는 claude 훅(bin/cchat-unread)이 단다: done=녹색(답 끝남), ask=주황(허락 대기).
set-hook -g client-session-changed "set -u @unread"
set-hook -g client-attached "set -u @unread"
set-hook -g client-focus-in "set -u @unread"
set-hook -g client-active "set -u @unread"
# 새로 접속하면 ◀▶ 범위 기억을 지운다(같은 tty 이름을 재사용해도 지금 대화 탭이 보이게).
set-hook -g client-attached[1] "run-shell \"rm -f @@HOME@@/.cache/cchat-tabs/$(echo '#{client_name}' | sed 's#^/##; s#/#_#g')\""
# 대화를 닫으면(q) 보고 있던 브라우저는 끊지 말고 다른 대화로 옮긴다.
# 끊기면 자동 재연결이 ?arg=이름 으로 방금 닫은 대화를 다시 만들어 버린다.
set -g detach-on-destroy off
# 터미널 제목 = cchat:<대화>. 브라우저 쪽(cchat-build-index)이 이걸 보고 다시 붙을 때 보던 대화로 붙는다.
set -g set-titles on
set -g set-titles-string "cchat:#S"

# PC 탭 단축키(웹 화면 JS가 Alt+숫자 → M-숫자, Alt+←/→ → M-Left/M-Right로 보낸다): 번호 대화 / 이전·다음 대화
bind -n M-Left run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' prev"
bind -n M-Right run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' next"
# Alt+↑/↓: 여러 줄 탭 모드에서 위/아래 칸 탭(웹 화면은 tab rows 2~5일 때만 보낸다)
bind -n M-Up run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' up"
bind -n M-Down run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' down"
# Alt+U = 폰에서 올린 파일 가져오기(페이지 📎가 보냄), Alt+A(폰 키 바 ★) = 확인할 대화로, Alt+O(폰 키 바 ☰) = 전체 모아보기(상태·이름표, 오른쪽에 화면 미리보기)
bind -n M-u run-shell -b "@@HOME@@/.local/bin/cchat-inbox"
bind -n M-a run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' attention"
# Alt+L(폰 ⋯ 줄의 ☰) = Claude 세션 목록(display-popup의 명령은 #{} 형식을 안 풀어서 run-shell로 감싸 누른 화면 이름을 넘긴다)(탭마다 마지막 작업 뒤 지난 시간·큰 흐름·지금 하는 일·끄기, cchat-ls)
bind -n M-l run-shell -b "@@BREW@@/tmux -L @@TMUX_SOCKET@@ display-popup -c '#{client_name}' -E -w 100% -h 100% -s bg=colour67,fg=colour61 -S fg=colour68 \"@@HOME@@/.local/bin/cchat-ls --client '#{client_name}'\" || true"
# F12 = 폰 Termux 키 줄의 🎤. cchat-termux로 붙으면 거기서 먼저 가로채 음성 입력을 한다. 여기까지 왔으면 그냥 ssh로 붙은 것 → 안내만(claude에 ~가 찍히지 않게)
bind -n F12 display-message -d 4000 '🎤는 cchat-termux로 접속해야 동작합니다 (Termux: cchat)'
bind -n M-o choose-tree -Zs -O name -F "#{?#{==:#{@unread},ask},[확인] ,#{?#{==:#{@unread},done},[끝남] ,#{?#{@busy},[작업 중] ,}}}#{pane_title}"
bind -n M-0 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 0"
bind -n M-1 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 1"
bind -n M-2 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 2"
bind -n M-3 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 3"
bind -n M-4 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 4"
bind -n M-5 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 5"
bind -n M-6 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 6"
bind -n M-7 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 7"
bind -n M-8 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 8"
bind -n M-9 run-shell "@@HOME@@/.local/bin/cchat-tabs go '#{client_name}' 9"
