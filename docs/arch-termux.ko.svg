.tb0{fill:#e6edf3}.tb1{fill:#173b26}.tb2{fill:#45300f}.tb3{fill:#272e37}
}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Helvetica,Arial,sans-serif}
</style><rect class="bg" x=".5" y=".5" width="959" height="403" rx="16"/><text class="title" x="28" y="38">폰 터미널 (Termux)</text><text class="sub" x="28" y="58">웹을 거치지 않고 ssh로 tmux에 바로. 🎤는 폰이 녹음하고 맥이 글로 바꾼다.</text><rect class="mac" x="452" y="76" width="484" height="300" rx="18"/><text class="macl" x="918" y="98" text-anchor="end">내 맥</text><rect class="nd" x="24" y="116" width="186" height="124" rx="12"/><text class="t" x="40" y="144">Termux</text><text class="s" x="40" y="164">ssh · 같은 탭</text><rect class="k" x="38" y="180" width="26" height="22" rx="5"/><text class="kt" x="51.0" y="195" text-anchor="middle">🎤</text><rect class="k" x="68" y="180" width="26" height="22" rx="5"/><text class="kt" x="81.0" y="195" text-anchor="middle">키보드</text><rect class="k" x="98" y="180" width="26" height="22" rx="5"/><text class="kt" x="111.0" y="195" text-anchor="middle">ALT</text><rect class="k" x="128" y="180" width="26" height="22" rx="5"/><text class="kt" x="141.0" y="195" text-anchor="middle">↑</text><rect class="k" x="158" y="180" width="26" height="22" rx="5"/><text class="kt" x="171.0" y="195" text-anchor="middle">⇧⏎</text><rect class="k" x="38" y="206" width="26" height="22" rx="5"/><text class="kt" x="51.0" y="221" text-anchor="middle">⏎</text><rect class="k" x="68" y="206" width="26" height="22" rx="5"/><text class="kt" x="81.0" y="221" text-anchor="middle">TAB</text><rect class="k" x="98" y="206" width="26" height="22" rx="5"/><text class="kt" x="111.0" y="221" text-anchor="middle">←</text><rect class="k" x="128" y="206" width="26" height="22" rx="5"/><text class="kt" x="141.0" y="221" text-anchor="middle">↓</text><rect class="k" x="158" y="206" width="26" height="22" rx="5"/><text class="kt" x="171.0" y="221" text-anchor="middle">→</text><rect class="n" x="240" y="116" width="180" height="64" rx="12"/><text class="t" x="256" y="144">cchat-termux</text><text class="s" x="256" y="164">🎤와 ⏎를 가로챔</text><path id="p1" class="e" d="M210,148 L240,148"/><polygon class="ah" points="240,148 232,143.5 232,152.5"/><rect class="n" x="476" y="116" width="196" height="92" rx="12"/><text class="t" x="492" y="144">tmux</text><text class="s" x="492" y="164">대화 하나 = 탭 하나</text><rect class="tb0" x="492" y="178" width="19" height="10" rx="3"/><rect class="tb1" x="514" y="178" width="19" height="10" rx="3"/><rect class="tb2" x="536" y="178" width="19" height="10" rx="3"/><rect class="tb3" x="558" y="178" width="19" height="10" rx="3"/><rect class="tb3" x="580" y="178" width="19" height="10" rx="3"/><rect class="n" x="712" y="116" width="200" height="92" rx="12"/><text class="t" x="728" y="144">claude × N</text><text class="s" x="728" y="164">내 파일·도구·설정</text><text class="s" x="728" y="181">그대로</text><path id="p2" class="e" d="M672,162 L712,162"/><polygon class="ah" points="712,162 704,157.5 704,166.5"/><path id="p3" class="ea" d="M420,140 L476,140"/><polygon class="aha" points="476,140 468,135.5 468,144.5"/><circle class="dot" r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><text class="el" x="470" y="104" text-anchor="start">ssh (사설망)</text><rect class="n" x="240" y="264" width="180" height="64" rx="12"/><text class="t" x="256" y="292">녹음</text><text class="s" x="256" y="312">Termux:API, 창 없음</text><path id="p4" class="eo" d="M300,180 L300,264"/><polygon class="aho" points="300,264 295.5,256 304.5,256"/><circle class="doto" r="3.2"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><text class="el" x="308" y="226" text-anchor="start">🎤</text><rect class="n" x="476" y="264" width="196" height="92" rx="12"/><text class="t" x="492" y="292">cchat-stt</text><text class="s" x="492" y="312">whisper.cpp · 약 1.5초</text><text class="s" x="492" y="329">쓸 때만 메모리</text><path id="p5" class="eo" d="M420,296 L476,296"/><polygon class="aho" points="476,296 468,291.5 468,300.5"/><circle class="doto" r="3.2"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href=