}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Helvetica,Arial,sans-serif}
</style><rect class="bg" x=".5" y=".5" width="959" height="391" rx="16"/><text class="title" x="28" y="38">폰 브라우저</text><text class="sub" x="28" y="58">PC와 같은 대화. 키 바, 좌우로 밀어 탭 이동, 링크 톡 열기.</text><rect class="mac" x="392" y="76" width="544" height="292" rx="18"/><text class="macl" x="410" y="98">내 맥</text><rect class="nd" x="24" y="116" width="184" height="124" rx="12"/><text class="t" x="40" y="144">폰 브라우저</text><text class="s" x="40" y="164">밀어서 탭 이동 · 링크 톡</text><text class="s" x="40" y="181">번호 선택지 → 버튼</text><rect class="k" x="40" y="202" width="28" height="22" rx="5"/><text class="kt" x="54.0" y="217" text-anchor="middle">★</text><rect class="k" x="72" y="202" width="28" height="22" rx="5"/><text class="kt" x="86.0" y="217" text-anchor="middle">Esc</text><rect class="k" x="104" y="202" width="28" height="22" rx="5"/><text class="kt" x="118.0" y="217" text-anchor="middle">⇥</text><rect class="k" x="136" y="202" width="28" height="22" rx="5"/><text class="kt" x="150.0" y="217" text-anchor="middle">↑</text><rect class="k" x="168" y="202" width="28" height="22" rx="5"/><text class="kt" x="182.0" y="217" text-anchor="middle">⋯</text><rect class="n" x="236" y="124" width="132" height="76" rx="12"/><text class="t" x="252" y="152">인증 + 서버</text><text class="s" x="252" y="172">예: Cloudflare</text><text class="s" x="252" y="189">Access</text><path id="p1" class="e" d="M208,162 L236,162"/><polygon class="ah" points="236,162 228,157.5 228,166.5"/><rect class="n" x="412" y="116" width="128" height="92" rx="12"/><text class="t" x="428" y="144">ttyd</text><text class="s" x="428" y="164">웹 터미널</text><text class="s" x="428" y="181">127.0.0.1에만</text><rect class="n" x="568" y="116" width="176" height="92" rx="12"/><text class="t" x="584" y="144">tmux</text><text class="s" x="584" y="164">대화 하나 = 탭 하나</text><rect class="tb0" x="584" y="178" width="19" height="10" rx="3"/><rect class="tb1" x="606" y="178" width="19" height="10" rx="3"/><rect class="tb2" x="628" y="178" width="19" height="10" rx="3"/><rect class="tb3" x="650" y="178" width="19" height="10" rx="3"/><rect class="tb3" x="672" y="178" width="19" height="10" rx="3"/><rect class="n" x="772" y="116" width="148" height="92" rx="12"/><text class="t" x="788" y="144">claude × N</text><text class="s" x="788" y="164">내 파일·도구·설정</text><text class="s" x="788" y="181">그대로</text><path id="p2" class="e" d="M540,162 L568,162"/><polygon class="ah" points="568,162 560,157.5 560,166.5"/><path id="p3" class="e" d="M744,162 L772,162"/><polygon class="ah" points="772,162 764,157.5 764,166.5"/><rect class="n" x="568" y="242" width="176" height="64" rx="12"/><text class="t" x="584" y="270">cchat-unread</text><text class="s" x="584" y="290">claude 훅 → 탭 색</text><path id="p4" class="eg" d="M846.0,208 L846.0,274 L744,274"/><polygon class="ahg" points="744,274 752,269.5 752,278.5"/><circle class="dotg" r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><text class="el" x="854.0" y="238" text-anchor="start">훅</text><path id="p5" class="eg" d="M656.0,242 L656.0,208"/><polygon class="ahg" points="656.0,208 651.5,216 660.5,216"/><circle class="dotg" r="3.2"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle><text class="el" x="664.0" y="229" text-anchor="start">색</text><path id="p6" class="ea" d="M368,162 L412,162"/><polygon class="aha" points="412,162 404,157.5 404,166.5"/><circle class="dot" r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle><text class="el" x="302" y="220" text-anchor="middle">SSH 역방향 통로</text><rect class="n" x="24" y="270" width="184" height="74" rx="12"/><text class="t" x="40" y="298">알림 훅</text><text class="s" x="40" y="318">ntfy · 웹 푸시 · …</text><text class="s" x="40" y="335">(직접 고름)</text><path id="p7" class="eo" d="M656.0,306 L656.0,358 L116,358 L116,344"/><polygon class="aho" points="116,344 111.5,352 120.5,352"/><circle class="doto" r="